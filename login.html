<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — LegisCore</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-page">
<main class="auth-wrap">
  <div class="card">
    <h1>LegisCore</h1>
    <p class="sub">Sign in to your filing room</p>
    <div class="err" id="err" hidden></div>
    <form id="f" autocomplete="on" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username" inputmode="email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button class="primary" type="submit" id="btn">Sign in</button>
    </form>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/core/supabase.js"></script>
<script src="js/core/auth.js"></script>
<script>
  (function () {
    // If already logged in, skip the form.
    if (Auth.isLoggedIn() && Auth.currentUser()) {
      window.location.replace('index.html');
      return;
    }
    const f = document.getElementById('f');
    const err = document.getElementById('err');
    const btn = document.getElementById('btn');

    function show(msg) {
      err.textContent = msg;
      err.hidden = false;
    }
    function busy(on) {
      btn.disabled = on;
      btn.textContent = on ? 'Signing in…' : 'Sign in';
    }

    f.addEventListener('submit', async function (e) {
      e.preventDefault();
      err.hidden = true;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { show('Enter your email and password.'); return; }
      busy(true);
      try {
        await Auth.login(email, password);
        window.location.replace('index.html');
      } catch (ex) {
        const m = (ex && ex.message) ? ex.message : '';
        if (/invalid|credentials|grant/i.test(m)) show('Wrong email or password.');
        else if (/not active/i.test(m)) show('Your account is not active. Ask your administrator.');
        else show(m || 'Could not sign in.');
        busy(false);
      }
    });
  })();
</script>
</body>
</html>
