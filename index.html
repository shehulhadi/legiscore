<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1c3d">
    <title>LegisCore</title>
    <link rel="stylesheet" href="css/base.css?v=3">
    <link rel="stylesheet" href="css/layout.css?v=3">
    <link rel="stylesheet" href="css/components.css?v=3">
</head>
<body>
    <div id="app">
        <div class="view-loading">
            <div class="spinner"></div>
            <p class="text-sm">Loading LegisCore&hellip;</p>
        </div>
    </div>

    <!--
      Load order is load-order-sensitive.
      1. config      — no deps
      2. api.js      — depends on config
      3. state.js    — no deps, but other modules need it loaded FIRST
      4. api/*       — depend on api.js + state.js
      5. router.js   — depends on state
      6. pages/*     — depend on api + state + router
      7. layout.js   — depends on state + router
      8. app.js      — orchestrates everything
    -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/state.js"></script>
    <script src="js/api/activities-api.js"></script>
    <script src="js/api/auth-api.js"></script>
    <script src="js/api/documents-api.js"></script>
    <script src="js/api/matters-api.js"></script>
    <script src="js/api/clients-api.js"></script>
    <script src="js/api/settings-api.js"></script>
    <script src="js/api/storage-api.js"></script>
    <script src="js/router.js"></script>
    <script src="pages/dashboard.js"></script>
    <script src="pages/documents.js"></script>
    <script src="pages/documents-modal.js"></script>
    <script src="pages/matters.js"></script>
    <script src="pages/matter-detail.js"></script>
    <script src="pages/clients.js"></script>
    <script src="pages/client-detail.js"></script>
    <script src="pages/settings.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/app.js"></script>

<!-- LegisCore AI Assistant Button -->
<style>
  .lc-ai-btn {
    position: fixed; bottom: 24px; right: 24px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white; padding: 14px 24px; border-radius: 50px;
    font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 16px;
    text-decoration: none; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4); z-index: 9999;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .lc-ai-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 35px rgba(59, 130, 246, 0.6); color: white; }
</style>
<a href="https://shehulhadi.github.io/ai-prototype/app.html" target="_blank" class="lc-ai-btn">
  <span>✨</span> Launch AI Associate
</a>

</body>
</html>
